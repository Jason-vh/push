services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://push:${POSTGRES_PASSWORD}@db:5432/push_padel?schema=public
      PORT: 3000
    ports:
      - "127.0.0.1:${PUSH_APP_HOST_PORT:-3001}:3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: push_padel
      POSTGRES_USER: push
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - push_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d push_padel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  push_postgres_data:
