services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://push:${POSTGRES_PASSWORD}@postgres:5432/push_padel?schema=public
      PORT: 3000
    ports:
      - "127.0.0.1:${PUSH_APP_HOST_PORT:-3001}:3000"
    networks:
      - apps-net

networks:
  apps-net:
    external: true
