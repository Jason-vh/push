name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: push-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_DIR: /home/exedev/apps/push

jobs:
  deploy:
    name: Deploy to exe.dev VM
    runs-on: [self-hosted, linux, push-prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write production env file
        run: |
          cat > .env.production <<EOF
          APP_URL=https://push.vhtm.eu
          NEXT_PUBLIC_APP_URL=https://push.vhtm.eu
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          PUSH_APP_HOST_PORT=3001
          COMPOSE_PROJECT_NAME=push
          EOF

      - name: Copy checkout to stable deploy directory
        run: |
          rm -rf "$DEPLOY_DIR.tmp"
          mkdir -p "$DEPLOY_DIR.tmp"
          cp -a . "$DEPLOY_DIR.tmp/"
          rm -rf "$DEPLOY_DIR"
          mv "$DEPLOY_DIR.tmp" "$DEPLOY_DIR"

      - name: Deploy with Docker Compose
        run: |
          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production up -d --build --remove-orphans
          docker compose --env-file .env.production ps

      - name: Prune unused docker resources
        if: always()
        run: |
          docker image prune -af
          docker builder prune -f --keep-storage 2GB
